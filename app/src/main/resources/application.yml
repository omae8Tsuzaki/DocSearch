spring:
  application:
    name: DocSearch
  config:
    # ドメイン固有の設定を読み込む
    import: classpath:domain-config.yml

server:
  port: 8421
  # ローカル専用アプリのため、ループバックのみで待ち受ける（同一LANの第三者からのアクセスを防止）
  address: 127.0.0.1

logging:
  file:
    # 出力先は起動時に DocSearchApplication が設定する（データ保存先と同じフォルダ）。
    # 未設定（テスト等）の場合はファイル出力せずコンソールのみ。
    name: ${docsearch.log.file:}
