[versions]
# Spring Boot
spring-boot-version = "4.1.0"
# JUnit
junit-bom-version = "6.0.0"

[libraries]
# Spring Boot
spring-boot-starter-web      = { group = "org.springframework.boot", name = "spring-boot-starter-web",      version.ref = "spring-boot-version" }

# junit
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-bom-version" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher"}

[bundles]
[plugins]
